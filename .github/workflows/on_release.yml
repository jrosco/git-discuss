name: Desktop release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name || github.event.release.tag_name }}

      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev libfuse2 libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev wget

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        if: runner.os != 'Windows'
        run: npm ci

      - name: Install npm dependencies (Windows)
        if: runner.os == 'Windows'
        run: npm.cmd ci

      - name: Build desktop installer
        if: runner.os != 'Windows'
        run: npm run desktop:dist

      - name: Build desktop installer (Windows)
        if: runner.os == 'Windows'
        run: npm.cmd run desktop:dist

      - uses: actions/upload-artifact@v7
        with:
          name: git-discuss-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach installers to GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: git-discuss-*
          path: release-artifacts
          merge-multiple: true

      - name: Upload installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name }}
        run: |
          mapfile -d '' files < <(find release-artifacts -type f -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No desktop installer artifacts were downloaded."
            exit 1
          fi
          gh release upload "${RELEASE_TAG}" "${files[@]}" --clobber
