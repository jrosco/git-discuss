name: Tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        if: runner.os != 'Windows'
        run: npm ci

      - name: Install npm dependencies (Windows)
        if: runner.os == 'Windows'
        run: npm.cmd ci

      - name: Run tests
        if: runner.os != 'Windows'
        run: npm test

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: npm.cmd test

  build-smoke:
    name: Build and smoke test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        if: runner.os != 'Windows'
        run: npm ci

      - name: Install npm dependencies (Windows)
        if: runner.os == 'Windows'
        run: npm.cmd ci

      - name: Typecheck
        if: runner.os != 'Windows'
        run: npm run typecheck

      - name: Typecheck (Windows)
        if: runner.os == 'Windows'
        run: npm.cmd run typecheck

      - name: Build
        if: runner.os != 'Windows'
        run: npm run build

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npm.cmd run build

      - name: Smoke test
        if: runner.os != 'Windows'
        run: npm run test:smoke

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: npm.cmd run test:smoke

  desktop-check:
    name: Tauri check on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev libfuse2 libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev wget

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        if: runner.os != 'Windows'
        run: npm ci

      - name: Install npm dependencies (Windows)
        if: runner.os == 'Windows'
        run: npm.cmd ci

      - name: Prepare desktop resources
        if: runner.os != 'Windows'
        run: npm run desktop:prepare

      - name: Prepare desktop resources (Windows)
        if: runner.os == 'Windows'
        run: npm.cmd run desktop:prepare

      - name: Check Tauri desktop host
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
